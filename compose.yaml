services:
  goq:
    build:
      context: .
    working_dir: /workspace
    environment:
      GOQ_CDP_HOST: ${GOQ_CDP_HOST:-host.docker.internal}
      GOQ_HOST_WORKSPACE: ${GOQ_HOST_WORKSPACE:-}
      GOQ_CONTAINER_WORKSPACE: /workspace
      TZ: Asia/Tokyo
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - ${USERPROFILE}/.codex:/root/.codex:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sleep", "infinity"]
